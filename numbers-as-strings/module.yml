- type: header
  content: "printf"
- type: markdown
  expandable: False
  name: "printf"
  content: |
    Les programmes n'affichent presque jamais une seule chaîne fixe.
    Ils affichent des messages assemblés à partir de mots fixes et de valeurs changeantes : `answer: 13`, `hello, hacker`, `opened 3 files`, et ainsi de suite.
    On pourrait écrire chaque message à la main, mais chaque nouvelle forme de message demanderait alors ses propres boucles de copie, ses conversions de nombres et ses appels à `write`.
    Une **chaîne de format** est une recette compacte pour construire ces messages.
    Les caractères ordinaires de la recette sont affichés tels quels, tandis que des marqueurs spéciaux indiquent où placer la valeur suivante.
    Le code qui exécute une telle recette s'appelle un **formateur**.
    `printf` est le nom traditionnel d'un formateur qui affiche son résultat.

    Ce mini-module vous fera construire votre propre `printf`.
    Votre version sera particulière : elle sera à vous !
    De nombreuses autres versions de `printf` existent. Par exemple, la « bibliothèque standard C », qui fournit des fonctions utiles pour écrire des applications en langage C, en contient une implémentation, et votre ligne de commande en dispose aussi :

    ```console
    hacker@dojo:~$ printf Hello
    Hello
    hacker@dojo:~$
    ```

    Nous construirons cette idée pas à pas : texte littéral, octet de saut de ligne ASCII, caractères de syntaxe échappés, nombres décimaux, valeurs répétées, chaînes, et enfin octets quelconques.
