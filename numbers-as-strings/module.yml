- type: header
  content: "La calculatrice"
- type: markdown
  expandable: False
  name: "La calculatrice (The Calculator)"
  content: |
    Vous pouvez transformer un texte en nombre avec votre `atoi`, et un nombre en texte avec votre `itoa`.
    Maintenant, vous allez utiliser les deux ensemble pour construire une petite calculatrice en ligne de commande.
    Elle lit une expression dans `argv` (un opérande de gauche, un opérateur et un opérande de droite), par exemple `prog 6 + 7`.
    Les opérandes sont des chaînes que vous savez déjà traiter : on applique `atoi` à chacune.
    L'opérateur est la nouveauté : c'est un caractère unique selon lequel le programme se branche pour décider du calcul, et il s'arrête pour tout opérateur non pris en charge.
    On applique ensuite `itoa` au résultat, puis `write` vers la sortie standard, exactement comme pour votre programme d'addition.
    Nous ajouterons un groupe d'opérateurs à la fois : l'addition, puis la soustraction, puis la multiplication, puis les opérateurs bit à bit, et enfin les opérateurs unaires. Chacun réutilise les `atoi` et `itoa` que vous avez déjà écrits.
