  - name: "Astuce : déboguer son assembleur (Tip - Debugging Your Assembly)"
    type: markdown
    content: |
      Ces défis sont écrits en Python et exécutent votre code assembleur dans un émulateur.
      On ne peut donc pas utiliser les outils de débogage habituels, comme `gdb`, pour déboguer le défi. Un outil de débogage spécial a toutefois été ajouté à ces défis.
      Si le défi exécute une instruction `int3` présente dans votre code assembleur, l'émulateur affiche l'état courant des registres et de la mémoire.
      C'est très utile pour raisonner sur son code !
  - name: "Pour aller plus loin (Further Reading)"
    type: markdown
    content: |
      - Une excellente série d'introduction, qui couvre une partie des bases, proposée par [LiveOverflow](https://www.youtube.com/watch?v=iyAyN3GFM7A&list=PLhixgUqwRTjxglIswKp9mpkfPNfHkzyeN&index=1) (en anglais).
      - [Ike: The Systems Hacking Handbook](https://ike.mahaloz.re/1_introduction/introduction.html), excellent guide sur l'organisation des ordinateurs (en anglais).
      - Un [tutoriel complet d'assembleur](https://github.com/mytechnotalent/Reverse-Engineering-Tutorial) pour plusieurs architectures (amd64 est celle qui nous intéresse ici), en anglais.
      - Le cours [« Architecture 1001: x86-64 Assembly »](https://ost2.fyi/Arch1001) d'OpenSecurityTraining2 (en anglais).
      - Un [livre complet sur l'assembleur x86_64](https://open.umn.edu/opentextbooks/textbooks/733), en anglais.
      - Un [jeu](https://squallygame.com/) pour apprendre l'assembleur x86, et un autre pour [tester ses connaissances](https://oooverflow.io/zero-is-you/) (en anglais).
      - Un [schéma](https://soc.me/interfaces/x86-prefixes-and-escape-opcodes-flowchart) des préfixes et des opcodes d'échappement de x86 (en anglais).
      - Une [référence x86](https://www.felixcloutier.com/x86/) non officielle, mais très détaillée et utile (en anglais).
