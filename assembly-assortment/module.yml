- type: markdown
  name: "Décalages de bits (Bit Shifting)"
  content: |
    Un **décalage de bits** déplace chaque bit d'une valeur de largeur fixe du même nombre de positions.
    Un décalage à gauche rapproche les bits de l'extrémité de poids fort, fait disparaître les bits qui sortent par cette extrémité, et insère des zéros à l'extrémité de poids faible.
    Voici un décalage à gauche de deux positions, sur un octet :

    ```text
    avant :                       1011 0010  (178)
    perdus à l'extrémité haute :  10.. ....
    insérés à l'extrémité basse : .... ..00
    après un décalage à gauche de 2 :  1100 1000  (200)
    ```

    Un décalage logique à droite fait l'inverse : il rapproche les bits de l'extrémité de poids faible, fait disparaître les bits de poids faible, et insère des zéros à l'extrémité de poids fort.

    ```text
    avant :                       1101 1011  (219)
    perdus à l'extrémité basse :  .... ..11
    insérés à l'extrémité haute : 00.. ....
    après un décalage à droite de 2 :  0011 0110  (54)
    ```

    Chaque position binaire vaut deux fois la position située à sa droite.
    Décaler tous les bits d'une position vers la gauche double donc une valeur non signée, et décaler de `n` positions vers la gauche multiplie par `2^n`, tant qu'aucun bit `1` ne sort par l'extrémité haute.
    Décaler tous les bits d'une position vers la droite divise une valeur non signée par deux en supprimant le reste, donc décaler de `n` positions vers la droite divise par `2^n`.

    Sur x86 64 bits, `shl` décale vers la gauche et `shr` effectue le décalage à droite avec remplissage par des zéros.
    Ces instructions suivent la même forme, destination en premier, que des instructions comme `add` :

    ```asm
    shl rax, 2
    shr rax, 2
    ```

    Ces exemples utilisent un octet pour que chaque bit tienne à l'écran, mais le même mouvement a lieu sur les 64 bits de `rax`.
