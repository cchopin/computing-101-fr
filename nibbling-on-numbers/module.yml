name: "Manipuler les nombres bit par bit (Nibbling on Numbers)"
description: |
  Un octet compte huit bits ; sa moitié, quatre bits, s'appelle un *quartet* (nibble).
  Ce module examine les nombres à partir du bit : comment un ensemble de bits devient un nombre positif ou négatif en binaire, en hexadécimal et en décimal.
  Comprendre cela est indispensable pour savoir comment le processeur transforme des bits en données utilisables !
