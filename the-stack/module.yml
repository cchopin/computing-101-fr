- type: markdown
  name: "Les adresses de la pile sur une droite numérique (Stack Addresses as a Number Line)"
  content: |
    La pile se comprend plus facilement si on se rappelle que les adresses sont des nombres.
    Les schémas représentent souvent la pile verticalement, mais les nombres gardent un ordre simple, de gauche à droite :

    ```text
    adresses plus petites                                  adresses plus grandes
    ...  rsp-0x10      rsp-0x08      rsp      rsp+0x08      rsp+0x10  ...
    ```

    Les décalages positifs par rapport à `rsp`, comme `[rsp+8]`, lisent des octets situés à des adresses plus grandes.
    Les décalages négatifs, comme `[rsp-8]`, lisent des octets situés à des adresses plus petites.

    Au démarrage d'un programme, le noyau a déjà placé les données de lancement à l'adresse contenue dans `rsp`, puis à des adresses plus grandes, vers la droite de cette droite numérique.
